<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Student Portfolio Website">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        nav {
            background-color: #333;
            color: white;
            padding: 10px;
        }

        nav a {
            color: white;
            margin-right: 15px;
            text-decoration: none;
        }

        section {
            padding: 20px;
        }

        img {
            width: 200px;
            margin: 10px;
        }

        form input, form textarea {
            width: 100%;
            margin-bottom: 10px;
            padding: 8px;
        }
    </style>
</head>

<body>

    <!-- Dynamic Welcome Message -->
    <h1 id="welcomeMessage"></h1>

    <!-- Navigation -->
    <nav>
        <a href="#about">About</a>
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
    </nav>

    <!-- About Section -->
    <section id="about">
        <h2>About Me</h2>
        <p>
            Hello! My name is Armani. I am a student interested in technology and software development.
            I enjoy learning new programming skills and building projects that improve my understanding
            of web development.
        </p>
    </section>

    <!-- Projects Section -->
    <section id="projects">
        <h2>Projects</h2>

        <a href="https://github.com/tappar/project1" target="_blank">
            <img src="https://via.placeholder.com/200" alt="Project 1">
        </a>

        <a href="https://github.com/tappar/project2" target="_blank">
            <img src="https://via.placeholder.com/200" alt="Project 2">
        </a>

        <a href="https://github.com/tappar/project3" target="_blank">
            <img src="https://via.placeholder.com/200" alt="Project 3">
        </a>
    </section>

    <!-- Contact Section -->
    <section id="contact">
        <h2>Contact Me</h2>

        <form>
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email Address" required>
            <input type="text" placeholder="Subject">
            <textarea placeholder="Your Message"></textarea>
            <button type="submit">Submit</button>
        </form>
    </section>

    <!-- JavaScript -->
    <script>
        let userName = prompt("What is your name?");
        let welcomeMessage = document.getElementById("welcomeMessage");

        if (userName) {
            welcomeMessage.textContent = "Welcome to my portfolio, " + userName + "!";
        } else {
            welcomeMessage.textContent = "Welcome to my portfolio!";
        }
    </script>

</body>
</html>
